services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brahma_slides
      POSTGRES_USER: brahma
      POSTGRES_PASSWORD: brahma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brahma -d brahma_slides"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

